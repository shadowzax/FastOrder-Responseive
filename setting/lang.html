<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#FF5A00">
    <title>تبديل اللغة - طلبات</title>
    <meta name="description" content="اختر اللغة المفضلة">
    <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌐</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/line-awesome/1.3.0/line-awesome/css/line-awesome.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11">
    </script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#FF5A00',
                        secondary: '#FF8C38',
                        accent: '#FFB800',
                        dark: '#1A1A1A',
                        muted: '#717171',
                        success: '#00B14F',
                        lightPrimary: '#FFF1E8',
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --color-primary: #FF5A00;
            --color-secondary: #FF8C38;
            --color-accent: #FFB800;
            --color-background: #F7F9F8;
            --color-card: #FFFFFF;
            --color-darker: #F0F4F3;
            --color-paragraph: #333333;
            --color-white: #1A1A1A;
            --color-muted: #717171;
            --border-subtle: rgba(0, 0, 0, 0.08);
            --card-bg: #FFFFFF;
            --border-color: rgba(0, 0, 0, 0.1);
            --darker-bg: #F0F4F3;
            --header-height: 70px;
            --bottom-nav-height: 68px;
            --shadow-glow: 0 4px 20px rgba(255, 90, 0, 0.06);
            --shadow-card: 0 2px 12px rgba(0, 0, 0, 0.06);
            --dropdown-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            height: 100%;
            width: 100%;
            overscroll-behavior: none;
        }
        body {
            font-family: 'Noto Sans Arabic', 'Alexandria', system-ui, sans-serif;
            background-color: var(--color-background);
            color: var(--color-white);
            transition: background-color 0.3s, color 0.3s;
            overflow-x: hidden;
            padding-bottom: 0;
        }
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: var(--color-background);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #FF8C38;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #FF5A00;
        }
        #mainHeader {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--header-height);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            border-bottom: 1px solid var(--border-subtle);
            background: var(--color-background);
            z-index: 110;
            transition: background-color 0.3s;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 0;
        }
        .back-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--color-white);
            font-size: 1.8rem;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s, transform 0.2s;
            flex-shrink: 0;
        }
        .back-btn:hover {
            color: var(--color-primary);
            transform: scale(1.1);
        }
        .header-avatar-wrapper {
            position: relative;
            flex-shrink: 0;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .header-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--color-primary);
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
            display: block;
        }
        .header-avatar:hover {
            transform: scale(1.05);
        }
        .notification-btn {
            position: relative;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--color-muted);
            font-size: 1.5rem;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
            flex-shrink: 0;
        }
        .notification-btn:hover {
            color: #FF5A00;
        }
        .notification-btn .notification-dot {
            position: absolute;
            top: 2px;
            right: 2px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #FF5A00;
            border: 2px solid var(--card-bg);
        }
        .dropdown-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            z-index: 115;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        .dropdown-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .profile-dropdown {
            position: fixed;
            top: calc(var(--header-height) - 4px);
            left: 16px;
            width: 240px;
            max-width: calc(100vw - 32px);
            max-height: calc(100vh - var(--header-height) - 24px);
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: var(--dropdown-shadow);
            border: 1px solid var(--border-color);
            z-index: 120;
            overflow-y: auto;
            overflow-x: hidden;
            transform-origin: top left;
            transform: scale(0.92) translateY(-12px);
            opacity: 0;
            pointer-events: none;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.25s ease;
            overscroll-behavior: contain;
            padding: 6px 6px 10px;
        }
        .profile-dropdown.active {
            transform: scale(1) translateY(0);
            opacity: 1;
            pointer-events: auto;
        }
        @media (max-width: 480px) {
            .profile-dropdown {
                left: 8px;
                width: calc(100vw - 16px);
                max-width: none;
                border-radius: 14px;
                top: calc(var(--header-height) - 2px);
            }
        }
        .dropdown-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--color-muted);
            font-weight: 500;
            text-decoration: none;
            font-size: 0.9rem;
            -webkit-tap-highlight-color: transparent;
            position: relative;
        }
        .dropdown-item i {
            font-size: 20px;
            width: 28px;
            flex-shrink: 0;
            text-align: center;
        }
        .dropdown-item:hover {
            background: rgba(255, 90, 0, 0.07);
            color: var(--color-primary);
        }
        .dropdown-item:active {
            background: rgba(255, 90, 0, 0.12);
            transform: scale(0.98);
        }
        .dropdown-item.active {
            background: rgba(255, 90, 0, 0.12);
            color: var(--color-primary);
            font-weight: 700;
        }
        .dropdown-item.active::before {
            content: '';
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 24px;
            border-radius: 4px;
            background: var(--color-primary);
        }
        main {
            padding-top: var(--header-height);
            padding-bottom: 0;
        }
        @media (max-width: 1024px) {
            main {
                padding-bottom: calc(var(--bottom-nav-height) + 20px);
            }
            body {
                padding-bottom: 0;
            }
        }
        .bottom-mobile-nav {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: var(--bottom-nav-height);
            background: var(--card-bg);
            border-top: 1px solid var(--border-color);
            z-index: 100;
            padding: 6px 8px;
            padding-bottom: max(6px, env(safe-area-inset-bottom, 6px));
            box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.08);
            align-items: center;
            justify-content: space-around;
            gap: 4px;
        }
        @media (max-width: 1024px) {
            .bottom-mobile-nav {
                display: flex;
            }
        }
        .bottom-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            flex: 1;
            padding: 8px 4px;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            color: var(--color-muted);
            font-size: 0.68rem;
            font-weight: 600;
            transition: all 0.25s ease;
            position: relative;
            min-width: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .bottom-nav-item i {
            font-size: 1.35rem;
            transition: all 0.25s ease;
            flex-shrink: 0;
        }
        .bottom-nav-item span {
            white-space: nowrap;
            text-overflow: ellipsis;
            overflow: hidden;
            max-width: 100%;
            font-size: 0.65rem;
            letter-spacing: 0.2px;
        }
        .bottom-nav-item.active {
            color: var(--color-primary);
        }
        .bottom-nav-item.active i {
            font-size: 1.5rem;
        }
        .bottom-nav-item-center {
            position: relative;
            top: -20px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--color-primary);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(255, 90, 0, 0.4);
            transition: all 0.3s ease;
            flex-shrink: 0;
            flex: none;
            margin: 0 4px;
        }
        .bottom-nav-item-center i {
            font-size: 2rem;
        }
        .bottom-nav-item-center span {
            display: none;
        }
        .bottom-nav-item-center.active {
            background: #e04e00;
            color: #fff;
        }
        .section-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--color-muted);
            padding: 12px 16px 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .menu-card {
            background: var(--card-bg);
            border-radius: 16px;
            margin: 0 12px 12px;
            overflow: hidden;
            box-shadow: var(--shadow-card);
            border: 1px solid var(--border-color);
        }
        .language-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            border-bottom: 1px solid var(--border-color);
            -webkit-tap-highlight-color: transparent;
            position: relative;
        }
        .language-item:last-child {
            border-bottom: none;
        }
        .language-item:hover {
            background: rgba(255, 90, 0, 0.04);
        }
        .language-item:active {
            background: rgba(255, 90, 0, 0.08);
        }
        .language-item.selected {
            background: rgba(255, 90, 0, 0.06);
        }
        .language-flag {
            width: 42px;
            height: 30px;
            object-fit: cover;
            border-radius: 4px;
            flex-shrink: 0;
            border: 1px solid var(--border-color);
            box-shadow: 0 1px 2px rgba(0,0,0,0.08);
        }
        .language-info {
            flex: 1;
            min-width: 0;
        }
        .language-name {
            font-size: 1rem;
            font-weight: 700;
            color: var(--color-white);
        }
        .language-sub {
            font-size: 0.75rem;
            color: var(--color-muted);
            margin-top: 2px;
        }
        .language-radio {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }
        .language-item.selected .language-radio {
            border-color: var(--color-primary);
            background: var(--color-primary);
        }
        .language-item.selected .language-radio::after {
            content: '';
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #fff;
        }
        .btn-save {
            display: block;
            width: calc(100% - 24px);
            margin: 0 12px 20px;
            background: var(--color-primary);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            text-align: center;
        }
        .btn-save:hover {
            background: #e04e00;
        }
        @media (max-width: 640px) {
            .language-flag {
                width: 36px;
                height: 26px;
            }
            .language-item {
                padding: 14px;
            }
            .back-btn {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="dropdown-overlay" id="dropdownOverlay"></div>

    <div class="profile-dropdown" id="profileDropdown" role="menu" aria-label="قائمة المستخدم">
        <a href="#" class="dropdown-item" data-action="home"><i class="las la-home"></i><span>الرئيسية</span></a>
        <a href="#" class="dropdown-item" data-action="orders"><i class="las la-shopping-bag"></i><span>الطلبات</span></a>
        <a href="#" class="dropdown-item" data-action="cart"><i class="las la-shopping-cart"></i><span>السلة</span></a>
        <a href="#" class="dropdown-item" data-action="favorites"><i class="las la-heart"></i><span>المفضلة</span></a>
        <a href="#" class="dropdown-item" data-action="profile"><i class="las la-user"></i><span>حسابي</span></a>
        <a href="#" class="dropdown-item active" data-action="language"><i class="las la-language"></i><span>اللغة</span></a>
    </div>

    <main>
        <header id="mainHeader">
            <div class="header-right">
                <button class="back-btn" onclick="history.back()" aria-label="رجوع">
                    <i class="las la-arrow-right"></i>
                </button>
                <h1 class="text-lg font-extrabold" style="color: var(--color-white);">اللغة</h1>
            </div>
            <div class="flex items-center gap-2 flex-shrink-0">
                <button class="notification-btn" id="notificationBtn">
                    <i class="las la-bell"></i>
                    <span class="notification-dot"></span>
                </button>
                <div class="header-avatar-wrapper" id="headerAvatarWrapper" title="فتح القائمة">
                    <img id="headerAvatar" src="https://i.ibb.co/3mZjjp1T/548212938-1338267831079244-6599431839367735090-n.jpg" class="header-avatar" alt="avatar">
                </div>
            </div>
        </header>

        <div class="container mx-auto px-0 py-4 max-w-3xl">
            <div class="section-title">اختر لغة التطبيق</div>
            <div class="menu-card" id="languageList">
                <div class="language-item selected" data-lang="ar" onclick="selectLanguage(this)">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/0/0d/Flag_of_Saudi_Arabia.svg" class="language-flag" alt="Saudi Arabia">
                    <div class="language-info">
                        <p class="language-name">العربية</p>
                        <p class="language-sub">اللغة الافتراضية</p>
                    </div>
                    <div class="language-radio"></div>
                </div>
                <div class="language-item" data-lang="en" onclick="selectLanguage(this)">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/a/ae/Flag_of_the_United_Kingdom.svg" class="language-flag" alt="English">
                    <div class="language-info">
                        <p class="language-name">English</p>
                        <p class="language-sub">English (UK)</p>
                    </div>
                    <div class="language-radio"></div>
                </div>
                <div class="language-item" data-lang="es" onclick="selectLanguage(this)">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/9/9a/Flag_of_Spain.svg" class="language-flag" alt="Spanish">
                    <div class="language-info">
                        <p class="language-name">Español</p>
                        <p class="language-sub">Spanish</p>
                    </div>
                    <div class="language-radio"></div>
                </div>
                <div class="language-item" data-lang="de" onclick="selectLanguage(this)">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/b/ba/Flag_of_Germany.svg" class="language-flag" alt="German">
                    <div class="language-info">
                        <p class="language-name">Deutsch</p>
                        <p class="language-sub">German</p>
                    </div>
                    <div class="language-radio"></div>
                </div>
                <div class="language-item" data-lang="it" onclick="selectLanguage(this)">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/0/03/Flag_of_Italy.svg" class="language-flag" alt="Italian">
                    <div class="language-info">
                        <p class="language-name">Italiano</p>
                        <p class="language-sub">Italian</p>
                    </div>
                    <div class="language-radio"></div>
                </div>
                <div class="language-item" data-lang="ru" onclick="selectLanguage(this)">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/f/f3/Flag_of_Russia.svg" class="language-flag" alt="Russian">
                    <div class="language-info">
                        <p class="language-name">Русский</p>
                        <p class="language-sub">Russian</p>
                    </div>
                    <div class="language-radio"></div>
                </div>
            </div>

            <button class="btn-save" onclick="saveLanguage()">حفظ اللغة</button>
        </div>
    </main>

    <div class="bottom-mobile-nav" id="bottomMobileNav">
        <a href="#" class="bottom-nav-item" data-tab="home"><i class="las la-home"></i><span>الرئيسية</span></a>
        <a href="#" class="bottom-nav-item" data-tab="orders"><i class="las la-shopping-bag"></i><span>الطلبات</span></a>
        <a href="#" class="bottom-nav-item bottom-nav-item-center" data-tab="cart"><i class="las la-shopping-cart"></i><span>السلة</span></a>
        <a href="#" class="bottom-nav-item" data-tab="favorites"><i class="las la-heart"></i><span>المفضلة</span></a>
        <a href="#" class="bottom-nav-item active" data-tab="profile"><i class="las la-user"></i><span>حسابي</span></a>
    </div>

    <script>
        (function() {
            const headerAvatarWrapper = document.getElementById('headerAvatarWrapper');
            const dropdown = document.getElementById('profileDropdown');
            const dropdownOverlay = document.getElementById('dropdownOverlay');
            const notificationBtn = document.getElementById('notificationBtn');
            const bottomNavItems = document.querySelectorAll('.bottom-nav-item');
            const dropdownItems = document.querySelectorAll('.dropdown-item');
            let isDropdownOpen = false;
            let selectedLang = 'ar';

            function openDropdown() {
                isDropdownOpen = true;
                dropdown.classList.add('active');
                dropdownOverlay.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function closeDropdown() {
                isDropdownOpen = false;
                dropdown.classList.remove('active');
                dropdownOverlay.classList.remove('active');
                document.body.style.overflow = '';
            }

            function toggleDropdown() {
                if (isDropdownOpen) {
                    closeDropdown();
                } else {
                    openDropdown();
                }
            }

            if (headerAvatarWrapper) {
                headerAvatarWrapper.addEventListener('click', function(e) {
                    e.stopPropagation();
                    toggleDropdown();
                });
            }

            if (dropdownOverlay) {
                dropdownOverlay.addEventListener('click', function() {
                    closeDropdown();
                });
            }

            document.addEventListener('click', function(e) {
                if (isDropdownOpen) {
                    if (!dropdown.contains(e.target) && !headerAvatarWrapper.contains(e.target)) {
                        closeDropdown();
                    }
                }
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && isDropdownOpen) {
                    closeDropdown();
                }
            });

            dropdownItems.forEach(item => {
                item.addEventListener('click', function(e) {
                    e.preventDefault();
                    const action = this.getAttribute('data-action');
                    dropdownItems.forEach(i => i.classList.remove('active'));
                    this.classList.add('active');
                    const label = this.querySelector('span') ? this.querySelector('span').textContent : '';
                    closeDropdown();
                    if (action && action !== 'language') {
                        setTimeout(() => {
                            Swal.fire({
                                title: label || action,
                                icon: 'info',
                                confirmButtonColor: '#FF5A00'
                            });
                        }, 300);
                    }
                });
            });

            window.selectLanguage = function(element) {
                document.querySelectorAll('.language-item').forEach(function(item) {
                    item.classList.remove('selected');
                });
                element.classList.add('selected');
                selectedLang = element.getAttribute('data-lang');
            };

            window.saveLanguage = function() {
                Swal.fire({
                    title: 'تم الحفظ',
                    text: 'تم تغيير اللغة بنجاح',
                    icon: 'success',
                    confirmButtonColor: '#FF5A00'
                });
            };

            bottomNavItems.forEach(function(item) {
                item.addEventListener('click', function(e) {
                    e.preventDefault();
                    bottomNavItems.forEach(function(i) {
                        i.classList.remove('active');
                    });
                    this.classList.add('active');
                    const tab = this.getAttribute('data-tab');
                    let msg = '';
                    if (tab === 'home') msg = 'أنت في الصفحة الرئيسية';
                    else if (tab === 'orders') msg = 'طلباتك الحالية والسابقة';
                    else if (tab === 'cart') msg = 'سلة التسوق';
                    else if (tab === 'favorites') msg = 'قائمة المفضلة الخاصة بك';
                    else if (tab === 'profile') msg = 'حسابك الشخصي';
                    if (tab !== 'profile') {
                        Swal.fire({
                            title: msg,
                            icon: 'info',
                            confirmButtonColor: '#FF5A00'
                        });
                    }
                });
            });

            notificationBtn.addEventListener('click', function() {
                Swal.fire({
                    title: 'الإشعارات',
                    text: 'لديك 3 إشعارات جديدة',
                    icon: 'info',
                    confirmButtonColor: '#FF5A00'
                });
            });
        })();
    </script>
</body>
</html>
